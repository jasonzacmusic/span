<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background-color: #f3ece0;
    background-image:
      radial-gradient(900px 500px at 10% -10%, rgba(255,255,255,.8), transparent 60%),
      radial-gradient(700px 460px at 108% 110%, rgba(142,29,18,.07), transparent 60%);
    font-family: 'Archivo', sans-serif; color: #1a1713;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 62px 70px;
  }
  .top { display: flex; align-items: flex-end; gap: 20px; border-bottom: 3px double #bcac8d; padding-bottom: 22px; }
  .mark { height: 62px; filter: invert(1) brightness(.15); }
  h1 { font-family: 'Cormorant Garamond', serif; font-weight: 700; font-size: 82px; letter-spacing: .3em; line-height: .9; text-indent: .3em; }
  .tag { font-size: 13px; font-weight: 700; letter-spacing: .3em; text-transform: uppercase; color: #756853; margin-top: 12px; }
  .mid { display: flex; gap: 14px; flex-wrap: wrap; }
  .iv { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 14px 17px; border: 1px solid #bcac8d; background: rgba(255,255,255,.5); }
  .iv b { font-family: 'Cormorant Garamond', serif; font-size: 34px; line-height: 1; }
  .iv span { font-size: 8px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: #756853; }
  .line { font-family: 'Cormorant Garamond', serif; font-size: 44px; font-style: italic; color: #4b4234; }
  .bot { display: flex; align-items: flex-end; justify-content: space-between; border-top: 3px double #bcac8d; padding-top: 22px; }
  .bot .who { font-family: 'Cormorant Garamond', serif; font-size: 28px; }
  .bot .who b { font-weight: 700; }
  .url { font-family: 'IBM Plex Mono', monospace; font-size: 15px; color: #8e1d12; }
</style></head>
<body>
  <div class="top">
    <img class="mark" src="nsm-n-white.png">
    <div><h1>SPAN</h1><div class="tag">twelve distances · one view</div></div>
  </div>
  <div class="line">Every interval — heard, read, played and sung.</div>
  <div class="mid">
    <div class="iv" style="color:#9c6b18"><b>m2</b><span>minor 2nd</span></div>
    <div class="iv" style="color:#9c6b18"><b>M2</b><span>major 2nd</span></div>
    <div class="iv" style="color:#2f6b34"><b>m3</b><span>minor 3rd</span></div>
    <div class="iv" style="color:#2f6b34"><b>M3</b><span>major 3rd</span></div>
    <div class="iv" style="color:#1c3f7c"><b>P4</b><span>perfect 4th</span></div>
    <div class="iv" style="color:#a8271b"><b>TT</b><span>tritone</span></div>
    <div class="iv" style="color:#1c3f7c"><b>P5</b><span>perfect 5th</span></div>
    <div class="iv" style="color:#6b3a7a"><b>m6</b><span>minor 6th</span></div>
    <div class="iv" style="color:#6b3a7a"><b>M6</b><span>major 6th</span></div>
    <div class="iv" style="color:#16645f"><b>m7</b><span>minor 7th</span></div>
    <div class="iv" style="color:#16645f"><b>M7</b><span>major 7th</span></div>
    <div class="iv" style="color:#4a4237"><b>P8</b><span>octave</span></div>
  </div>
  <div class="bot">
    <div class="who">Built from the interval tricks taught by <b>Jason Zac</b></div>
    <div class="url">nathanielschool.com</div>
  </div>
</body></html>
